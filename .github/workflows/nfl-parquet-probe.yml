name: NFL Parquet Shape Probe
# One-shot pre-build shape probe for snap_counts/depth_charts/pbp (Rule 68).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pyarrow
        run: pip install pyarrow --break-system-packages -q
      - name: Run parquet shape probe
        run: python3 scripts/nfl-parquet-shape-probe.py
      - name: Commit probe output
        if: always()
        run: |
          git config user.email "parquet-probe@field"
          git config user.name "Parquet-Probe"
          git add outbox/nfl-parquet-shape-probe.txt || true
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "nfl parquet shape probe [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. Verified under the exact Actions shell (bash -e -o pipefail).
          # Without this line a lost artifact reports as a green step.
          # is-ancestor, not HEAD equality: another bot pushing after us is routine
          # here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
