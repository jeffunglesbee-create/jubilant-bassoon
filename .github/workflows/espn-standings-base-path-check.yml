name: ESPN Standings Base-Path Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run check
        run: node scripts/espn-standings-base-path-check.mjs
      - name: Push result
        run: |
          git config user.email "espn-base-path-check@field"
          git config user.name "ESPN-Base-Path-Check"
          git add outbox/espn-standings-base-path-check.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "espn-standings-base-path-check result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
