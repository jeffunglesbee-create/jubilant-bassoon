name: NFL BDB Tracking Update (P3)
on:
  schedule:
    - cron: '0 8 1 * *'   # monthly (tracking archive is static)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run BDB pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: b57e9af57ab46c52ca9215804e689c29
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/build-bdb-data.py
      - name: Commit outbox fallback
        run: |
          git config user.email "bdb-bot@field"
          git config user.name "BDB-Bot"
          git add outbox/nfl/bdb_speed.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "NFL BDB: player max speed $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
