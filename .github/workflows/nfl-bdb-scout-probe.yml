name: NFL BDB Scout Render Probe
# Rule 90: render the 5 BDB scout rows on a LIVE NFL game via real Playwright
# against the deployed URL. Commits a boolean manifest (allFiveRowsPresent,
# perRowPresentAcrossNFL) — not prose. Sandbox can't reach the worker; CI can.
on:
  workflow_dispatch:
  schedule:
    # Automated render check during NFL game windows (UTC). Off-season these
    # fire and record nflGameCount=0 → exit 0 (no-op, no red run). Regression
    # (NFL game present but a BDB row missing) → red run.
    - cron: '0 1 * * 5'   # Thu ~9pm ET — Thursday Night Football
    - cron: '0 21 * * 0'  # Sun ~5pm ET — afternoon slate underway
    - cron: '0 1 * * 2'   # Mon ~9pm ET — Monday Night Football
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps
      - name: Run NFL BDB scout probe
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev
        run: node nfl_bdb_scout_probe.js
      - name: Commit manifest + screenshot
        if: always()
        run: |
          git config user.email "bdb-probe@field"; git config user.name "BDB-Probe"
          git add outbox/nfl-bdb-scout-manifest-*.json outbox/nfl-bdb-scout-*.png || true
          git diff --cached --quiet && echo nothing && exit 0
          git commit -m "nfl bdb scout render probe [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
