name: BDB Frames Task 0 Probe
# field-relay-nba docs/CC-CMD-2026-10-15-build-bdb-frames.md, TASK 0 only:
# measure the Kaggle BDB archive (file sizes, weeks, games, plays, sample rate,
# event vocabulary, nflId resolution) BEFORE anything is extracted. Runs here
# because the Kaggle credentials are this repo's secrets. One tracking week is
# streamed and parsed, never stored; every other week is described from the
# listing and the small tables. Never prints the key.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (analysers, synthetic rows)
        run: python3 scripts/bdb-frames-task0-probe.py --self-test
      - name: Probe the archive
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/bdb-frames-task0-probe.py
      - name: Commit probe output
        if: always()
        run: |
          git config user.email "bdb-bot@field"
          git config user.name "BDB-Bot"
          git add outbox/bdb-frames-task0-*.json || true
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "BDB frames Task 0 probe result [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. is-ancestor, not HEAD equality: another bot pushing after us is
          # routine here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
