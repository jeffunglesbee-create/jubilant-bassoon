# .github/workflows/bundesliga-matchday-url-decisive.yml
#
# CC-CMD-2026-08-02-wire-bundesliga-bapi-broadcasts-v2 -- decisive retest.
# Directly navigates to /en/bundesliga/matchday/{season}/{N} for several
# distinct matchday numbers in the same run and compares the resulting
# DFL-DAY id per matchday -- the actual test for whether the day-ID
# resolution mechanism is real, now that a prior probe found the URL
# pattern is real but a methodological bug meant every earlier "distinct
# matchday" test always re-selected the same matchday (1).
#
# Result: outbox/bundesliga-matchday-url-decisive-result.json, [skip ci].

name: Bundesliga Matchday URL Decisive Retest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run decisive matchday-URL comparison
        run: npx playwright test tests/bundesliga-matchday-url-decisive.spec.js --config=tests/bundesliga-matchday-url-decisive.playwright.config.js
        continue-on-error: true

      - name: Push result
        run: |
          git config user.email "bundesliga-matchday-url-decisive@field"
          git config user.name "Bundesliga-Matchday-URL-Decisive-Probe"
          git add outbox/bundesliga-matchday-url-decisive-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "bundesliga-matchday-url-decisive result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Print result
        if: always()
        run: cat outbox/bundesliga-matchday-url-decisive-result.json 2>/dev/null || echo "No result file produced"
