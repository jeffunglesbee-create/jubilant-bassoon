name: ESPN MLB Standings Streak-Shape Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/espn-mlb-standings-probe.mjs
      - name: Push result
        run: |
          git config user.email "espn-mlb-standings-probe@field"
          git config user.name "ESPN-MLB-Standings-Probe"
          git add outbox/espn-mlb-standings-streak-shape.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "espn-mlb-standings-streak-shape result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
