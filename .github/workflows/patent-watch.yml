name: Patent Watch (weekly)

# Reads USPTO Patent Public Search (PPUBS) for the grant Tuesday and the
# publication Thursday before it, for every term in .github/patent-watchlist.txt.
# Files a GitHub issue per scan when matches are found, AUTO-ASSIGNED to the repo
# owner so the GitHub mobile app pushes a notification.
#
# A week is read completely or the run is red and no manifest is committed
# (.github/scripts/patent_watch.py). The earlier version read bulkdata.uspto.gov,
# whose DNS record is gone, and ended green on every fetch it failed.
#
# Auto-chains to patent-fulltext.yml for grant hits (cap 20) so the full
# claim text + FIELD comparison + Dropbox upload happen in the same Actions run.

on:
  schedule:
    # Wednesday 16:00 UTC: the day after the grant Tuesday; the PGPub Thursday it
    # reads is the one before that Tuesday.
    - cron: '0 16 * * 3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Override: YYYY-MM-DD of grant Tuesday (blank = most recent)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  actions: write   # required to invoke reusable workflows from this one

jobs:
  watch:
    runs-on: ubuntu-latest
    # About 70 paced calls (3 s apart) take 4 to 5 minutes; the default is 360.
    timeout-minutes: 30
    outputs:
      grant_hits: ${{ steps.run_watcher.outputs.grant_hits }}
      grant_hits_count: ${{ steps.run_watcher.outputs.grant_hits_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests --quiet

      - name: Run watcher
        id: run_watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WEEK_OVERRIDE: ${{ inputs.week }}
        run: |
          python3 .github/scripts/patent_watch.py

      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "patent-watch"
          git add outbox/patents/
          if ! git diff --cached --quiet; then
            git commit -m "patent-watch: $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
            git fetch -q origin "${GITHUB_REF_NAME}"
            git merge-base --is-ancestor HEAD "origin/${GITHUB_REF_NAME}" \
              || { echo "FAIL: the manifest push did not land after retries"; exit 1; }
          fi

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.run_watcher.outcome }}
          GRANT_HITS: ${{ steps.run_watcher.outputs.grant_hits }}
          GRANT_HITS_COUNT: ${{ steps.run_watcher.outputs.grant_hits_count }}
        run: |
          {
            echo "## Patent watch results"
            echo ""
            if [ "$OUTCOME" != "success" ]; then
              echo "**NOT READ** (watcher step: $OUTCOME). This week was not read completely, no manifest was committed and nothing was chained. The reason is in the Run watcher step."
            else
              echo "Grant hits: \`${GRANT_HITS_COUNT:-0}\`"
              if [ -n "$GRANT_HITS" ]; then
                echo "Auto-chaining patent-fulltext.yml for: \`$GRANT_HITS\`"
              else
                echo "No grant hits this week; auto-chain skipped."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Auto-chain: if grant hits exist, run the full pipeline on them.
  # PGPub hits are intentionally NOT chained (different publication-number
  # format requires the pg_claims endpoint, not g_claims).
  followup:
    needs: watch
    if: needs.watch.outputs.grant_hits != ''
    uses: ./.github/workflows/patent-fulltext.yml
    with:
      patents: ${{ needs.watch.outputs.grant_hits }}
      skip_dropbox: false
    secrets: inherit
