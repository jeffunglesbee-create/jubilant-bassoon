name: BDB Serve Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe live serve
        run: node scripts/bdb-serve-probe.mjs | tee outbox/bdb-serve-probe.log
      - name: Commit
        if: always()
        run: |
          git config user.email "bdb-probe@field"; git config user.name "BDB-Probe"
          git add outbox/bdb-serve-probe.log || true
          git diff --cached --quiet && echo nothing && exit 0
          git commit -m "bdb serve probe [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
