# .github/workflows/field-data.yml
#
# FIELD DATA — Daily Overlay Automation
#
# Runs each morning AFTER the daily brief. scripts/build-field-data.js reads the
# NHL, NBA, WNBA, MLB and MLS schedules itself (this workflow fetches nothing),
# extracts series records, optionally generates matchupNotes via Claude (if
# ANTHROPIC_API_KEY secret is set), then pushes outbox/field-data-today.json to
# the repo.
#
# WHAT UPDATES AUTOMATICALLY (no session needed):
#   - NHL/NBA series records (e.g. "MTL leads 2-0") after each playoff game
#   - AI matchupNotes if ANTHROPIC_API_KEY is configured
#
# MANUAL EDITS: edit outbox/field-data-today.json directly in the GitHub
# web UI with commit message "[skip ci]" for same-day corrections.
# This workflow will overwrite it the following morning.
#
# SECRETS NEEDED:
#   GEMINI_KEY         (optional, primary)  — gemini-3.1-flash-lite matchupNotes
#   ANTHROPIC_API_KEY  (optional, fallback) — Claude Sonnet 4 if Gemini absent/fails

name: FIELD Data — Daily Overlay

on:
  schedule:
    - cron: '30 7 * * *'   # 7:30 AM UTC = 3:30 AM ET (after daily-brief at 7:00 UTC)
  workflow_dispatch:
    inputs:
      espn_gotd:
        description: 'ESPN GOTD games (home|away, comma-sep). e.g. "New York Yankees|Boston Red Sox"'
        required: false
        default: ''
      peacock_gotd:
        description: 'Peacock GOTD games (home|away, comma-sep)'
        required: false
        default: ''

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Every source is read by the build script itself, through a reader that throws on an unclean answer
      # (scripts/nba-board.cjs, scripts/mlb-schedule.cjs, scripts/nhl-scoreboard.cjs). This step used to curl the NHL scoreboard
      # into /tmp/nhl.json with `|| echo '{}'`, which turned a failed request into a day with no games.
      - name: Set the date
        run: echo "TODAY=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build overlay JSON
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TODAY:            ${{ github.event.inputs.force_date  || '' }}
          ESPN_GOTD_IDS:    ${{ github.event.inputs.espn_gotd    || '' }}
          PEACOCK_GOTD_IDS: ${{ github.event.inputs.peacock_gotd || '' }}
        run: node scripts/build-field-data.js

      - name: Push overlay to outbox
        run: |
          git config user.name  "FIELD Data Bot"
          git config user.email "field-data@users.noreply.github.com"
          CURRENT=$(md5sum outbox/field-data-today.json 2>/dev/null | cut -d' ' -f1 || echo "")
          NEW=$(md5sum /tmp/field-data-today.json | cut -d' ' -f1)
          if [ "$CURRENT" = "$NEW" ]; then
            echo "No changes to overlay — skipping push"
            exit 0
          fi
          cp /tmp/field-data-today.json outbox/field-data-today.json
          git add outbox/field-data-today.json
          git commit -m "data: auto-overlay ${TODAY} [skip ci]"
          git push origin main || {
            echo "Push rejected — rebasing and retrying..."
            git fetch origin main && git rebase origin/main && git push origin main
          }
          echo "✅ Overlay updated for ${TODAY}"

      # Last, so the overlay above is already pushed: a source the build could not read is null in the file with its reason
      # in _meta.source_errors, and this step fails the run for it. The good sports are not lost to one unread source.
      # It vouches only for the sources in _meta.source_errors_cover (today: nba, wnba, mlb, nhl); the MLS reader and the ESPN GOTD flags still
      # turn a failed read into [] without recording it. The NBA read's check runs in nba-board-check.yml, not here: a
      # check that asserts text must not be able to stop the day's overlay.
      - name: Fail the run when a recorded source could not be read
        run: node scripts/field-data-source-errors.cjs /tmp/field-data-today.json
