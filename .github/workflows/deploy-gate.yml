# .github/workflows/deploy-gate.yml
#
# FAST-PATH CI-GATED DEPLOY — ~24 seconds total
#
# HOW IT WORKS:
#   1. Triggers ONLY on pushes that change code files (index.html, sw.js, field_utils.js)
#   2. Runs smoke.js only (~5s) — the structural gate, not the full test suite
#   3. On pass → wrangler deploys immediately (~19s)
#   4. On fail → no deploy. Broken code never reaches production.
#
# WHY NOT deploy-after-ci.yml (workflow_run):
#   That waits for full smoke-and-verify.yml (~4 min). Slower is never acceptable.
#   smoke.js alone is sufficient to prove index.html is structurally valid.
#   The pre-commit hook already ran both smoke files before this push arrived.
#
# [skip ci] BEHAVIOUR:
#   [skip ci] in commit message skips ALL GitHub Actions including this workflow.
#   → No deploy. Code waits on main until next normal code push.
#   → Governance gap closed for [skip ci] on index.html.
#
# DATA-ONLY PUSHES:
#   outbox/, scripts/sport-meta.json, STANDARDS.md, GOVERNANCE.json etc.
#   are NOT in the paths list → this workflow never fires for data commits.
#
# MANUAL TRIGGER (added 2026-08-02, CC-CMD-2026-08-02-deploy-gate-workflow-dispatch):
#   workflow_dispatch exists as a fallback for the case where a real,
#   path-matching, non-[skip ci] push commit doesn't fire the push
#   trigger above for reasons outside this repo's control (confirmed
#   real incident: commit c6f3ac90, CC-CMD-2026-08-02-URGENT-trigger-
#   deploy-gate -- push trigger never fired, root cause undetermined,
#   likely a GitHub-side webhook delivery issue not visible from here).
#   Use it to force a deploy of whatever is currently on main.
#
# REQUIRES: CLOUDFLARE_API_TOKEN secret in this repo's Actions secrets (set May 23 2026).

name: Deploy gate (fast smoke)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'field_utils.js'
      - 'wrangler.jsonc'
  workflow_dispatch: {}

concurrency:
  group: deploy-gate-main
  # Deliberately false: this must QUEUE runs so each one still fully
  # completes (smoke tests, deploy) rather than CANCEL an in-progress
  # run when a new one starts, which could abort a legitimate in-flight
  # deploy. Queueing means a later run's checkout will correctly see
  # the previous run's completed SW_VERSION sync-back commit before
  # computing its own, eliminating the stale-read race
  # (CC-CMD-2026-07-04-deploy-gate-sw-sync-race).
  cancel-in-progress: false

permissions:
  contents: write  # write needed to commit SW_VERSION sync back to repo

jobs:
  smoke-and-deploy:
    name: Smoke (~5s) → Deploy (~19s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync SW_VERSION to deploy date
        run: |
          # PM-9 (June 1 2026): use America/New_York (Eastern Time) instead
          # of UTC. The deploy gate runs whenever a commit pushes; if that
          # happens after midnight UTC but before midnight ET, the previous
          # behavior stamped the NEXT calendar day onto SW_VERSION while the
          # user (and product surfaces) were still on the PREVIOUS calendar
          # day. Result: Health Panel showed "2026-06-02" at 10pm ET on
          # June 1. ET tracks the product's local day.
          DEPLOY_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          # Defense in depth beyond the concurrency group above: a long-
          # running earlier job could still finish between THIS job's
          # checkout and this specific step, so refresh to actual current
          # main immediately before reading sw.js's suffix, rather than
          # relying on the workflow-start-time checkout (CC-CMD-2026-07-04-
          # deploy-gate-sw-sync-race). `|| true` -- a pull failure here must
          # not fail the whole sync step; the existing logic still runs
          # against whatever checkout is present, same as today's behavior.
          git pull --rebase --autostash origin main 2>/dev/null || true
          CURRENT=$(grep "^const SW_VERSION" sw.js | grep -o "'[^']*'" | tr -d "'")
          SUFFIX=$(echo "$CURRENT" | grep -o '[a-z]$' || echo "a")
          NEW_VERSION="${DEPLOY_DATE}${SUFFIX}"
          sed -i "s/const SW_VERSION *= *'[^']*'/const SW_VERSION = '${NEW_VERSION}'/" sw.js
          # Also sync index.html so A190 (sw.js === index.html) passes
          sed -i "s/const SW_VERSION = '[^']*'/const SW_VERSION = '${NEW_VERSION}'/" src/legacy/field.js
          node scripts/sync-source.mjs
          echo "✅ SW_VERSION synced to ${NEW_VERSION} in sw.js + src/legacy/field.js → index.html (ET)"
          # Exported so the post-deploy Confirm step can assert the LIVE bundle
          # actually carries this exact version (see that step's comment).
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Commit SW_VERSION sync back to repo
        run: |
          # A190 root-cause fix (June 23 2026):
          # Direct API commits to index.html bypass this workflow's sed sync,
          # leaving sw.js SW_VERSION stale in git. This step commits the sync
          # back so smoke-and-verify.yml always sees consistent files.
          # [skip ci] prevents a deploy loop.
          git config user.email "deploy-gate@field"
          git config user.name "Deploy-Gate"
          git diff --quiet sw.js src/legacy/field.js index.html && echo "SW_VERSION already in sync — no commit needed" && exit 0
          git add sw.js src/legacy/field.js index.html
          git commit -m "chore: sync SW_VERSION $(TZ='America/New_York' date +%Y-%m-%d) — A190 auto-fix [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 3))
          done
          echo "✅ SW_VERSION sync committed back to repo"

      # THE DEPLOY-DAY RULE, moved here from smoke.js A515 on 2026-09-05.
      #
      # A515 asserted "SW_VERSION starts with today's ET date" inside smoke.js,
      # which runs on every commit and cannot know whether a deploy is
      # happening. That made smoke red every day nobody deployed — measured
      # 1000/1 on 2026-09-05 with SW_VERSION at 2026-09-04f and nothing wrong
      # with it — and this repo's rule 3 is "smoke must pass before push", so
      # ordinary commits had to bypass the hook to land.
      #
      # Here the question is answerable: this job only runs when a deploy path
      # changed, so the deploy IS today.
      #
      # It also closes a gap the sync step had. That step seds three files and
      # then echoes a tick mark; `sed` exits 0 when its pattern matches nothing,
      # so a renamed constant or a changed quoting style would have printed
      # "✅ SW_VERSION synced" while changing nothing at all. Nothing downstream
      # would have noticed once A515 stopped being the thing that noticed.
      #
      # Reads index.html, which is what actually ships — sw.js and field.js are
      # the sources it is assembled from, and A190 asserts they agree.
      - name: SW_VERSION is dated today (ET)
        run: |
          set -euo pipefail
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          SHIPPED=$(grep -o "SW_VERSION = '[^']*'" index.html | head -1 | grep -o "'[^']*'" | tr -d "'")
          echo "index.html carries SW_VERSION '${SHIPPED}'; today in ET is ${TODAY}"
          case "$SHIPPED" in
            "${TODAY}"|"${TODAY}"[a-z]) echo "✅ dated today" ;;
            *)
              echo "::error::SW_VERSION '${SHIPPED}' is not dated ${TODAY}."
              echo "The A190 sync step above should have set it. A sed that matches"
              echo "nothing exits 0, so check that the constant is still spelled"
              echo "\`const SW_VERSION = '...'\` in sw.js and src/legacy/field.js."
              exit 1 ;;
          esac

      # Enabling a V2 gate is not enough to make a card. ec6e3859 opened eight
      # European gates and nothing rendered, because seven of them had no
      # card CREATOR -- only score overlays, which never make a card. That class
      # of gap is invisible for months because it only shows when a competition
      # is in season; this file's own SOCCER_LEAGUES comment dates the same gap
      # to 2026-08-02 and calls it "masked entirely by the May-Aug summer
      # break". The invariant is static, so it holds in July too.
      - name: Every V2 sport key has a card creator, not just a score overlay
        run: |
          node scripts/check-v2-key-has-card-path.mjs --self-test
          node scripts/check-v2-key-has-card-path.mjs

      # STANDARDS.md Rule 99 (DISTINGUISHABILITY-A). NOT a count gate: the
      # repo has 266 flagged sites today and most are correct defaults, so
      # failing on the number would make the gate useless on day one (Rule 97 --
      # CI as invariant, not error count). What IS asserted is that the check
      # still works: --self-test proves the classifier can fail, and --require
      # proves the matcher still reaches the main source file rather than
      # silently matching nothing. The count is printed for the log.
      - name: Absence-collapse census (Rule 99) — reports, does not gate on count
        run: |
          node scripts/check-absence-collapse.mjs --self-test
          node scripts/check-absence-collapse.mjs . --require=src/legacy/field.js

      # Two wiring attempts on one feature shipped green in a single session:
      # updateCard (0 callers) and renderCard (2, both NightOwl). Structural
      # smoke could not catch either, because the text was present both times.
      # This walks the chain instead, and self-tests against those two real
      # chains rather than invented ones.
      - name: Every declared render target reaches a caller that runs
        run: node scripts/check-render-reaches-dom.mjs

      # Runs the real exported function against enumerated fixtures instead of
      # matching source text. "unchanged from open" and a points shift are both
      # claims about CHANGE, and a claim about change needs two observations in
      # a known order — ODDS-PROOF.md records the day the "closing" snapshot was
      # captured 22 seconds BEFORE the opening one. Four mutations are proven to
      # fail this, including reverting to the equal-timestamps-only guard that
      # shipped this morning.
      - name: The odds movement line never claims change without a sequence
        run: node --experimental-strip-types --no-warnings scripts/check-odds-movement-sequence.mjs

      - name: Fast smoke (smoke.js only)
        run: |
          echo "Running smoke.js structural assertions..."
          node smoke.js index.html
          echo "✅ Smoke passed against source — building bundle"

      # The unslop-ui checklist, counted and ratcheted rather than banned.
      # Audited 2026-08-26: 289 decorative emoji across 79 distinct characters
      # (SPORT_ICONS maps 27 competitions to them and the primary nav is
      # `📰 Desk / 📖 Journal / ⚽ Groups`), 34 gradients, 6 gradient-text, 19
      # backdrop-filter, 11 coloured shadows, 25 keyframes.
      #
      # Zero would be red from the moment it shipped, and a red check nobody can
      # make green gets deleted — the reasoning docs/exposed-secrets.sha256
      # already states for the credential it cannot yet remove. So the counts are
      # recorded in docs/chrome-inventory.txt and only GROWTH fails. Several
      # lines are defensible and say so in that file; what is not defensible is
      # growth nobody noticed.
      #
      # Runs before the bundle: it reads source, needs no install, and a failure
      # here is cheaper to read than a build log.
      - name: Chrome inventory (unslop-ui checklist, ratcheted)
        run: node scripts/check-chrome-inventory.mjs --self-test && node scripts/check-chrome-inventory.mjs

      - name: Build esbuild bundle
        run: |
          npm ci --prefer-offline 2>/dev/null || npm install --ignore-scripts
          node scripts/build-bundle.mjs
          echo "✅ Bundle built — running strip-comments on bundled output"

      - name: Strip comments for deploy
        run: |
          echo "── Source: $(wc -c < index.html | xargs) bytes (git — full comments)"
          node scripts/strip-comments.js index.html
          mv index.deploy.html index.html
          echo "── Deploy: $(wc -c < index.html | xargs) bytes (stripped for users)"
          echo "✅ Comments live in git source — stripped artifact ready for Cloudflare"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b57e9af57ab46c52ca9215804e689c29
          wranglerVersion: "3.109.0"
          # gitHubToken removed: CF GitHub integration disconnected May 23 2026

      - name: Confirm — assert the LIVE site actually serves this deploy
        run: |
          # This step used to `echo "✅ Deployed $SHA"` and nothing else, so a
          # green deploy-gate proved only that wrangler exited 0 -- never that
          # the live site changed. That gap is not hypothetical: on 2026-08-08
          # commit 739ff868 sat on main for 922 MINUTES with SW_VERSION
          # 2026-08-08a while the live site still served 2026-08-06a, and the
          # only thing that noticed was a separate drift detector, hours late
          # (outbox/incident-deploy-drift-2026-08-08T20-28-33-507Z.md).
          #
          # Now asserts the deployed bundle really carries the version this run
          # stamped. Matches on the literal VERSION STRING, not the SW_VERSION
          # identifier: live-deploy-verify-probe.yml greps
          # `SW_VERSION=\{0,1\}['\"]`, which allows no spaces around `=` and so
          # matches nothing against `SW_VERSION = '...'` -- an assertion that
          # silently proves nothing. The version string is spacing-independent
          # and cannot be minified away.
          #
          # Bounded retry covers real propagation delay. If it never appears
          # this FAILS -- deliberately not a warning. A deploy that did not
          # reach users is a failed deploy, and a gate that shrugs at that is
          # the thing being fixed here.
          set -u
          URL="https://jubilant-bassoon.jeffunglesbee.workers.dev/"
          EXPECT="${NEW_VERSION:-}"
          if [ -z "$EXPECT" ]; then
            echo "::error::NEW_VERSION was not exported by the sync step — cannot verify the deploy."
            exit 1
          fi
          echo "Asserting live site serves SW_VERSION ${EXPECT}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/live.html -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            if [ "$CODE" = "200" ] && grep -qF "$EXPECT" /tmp/live.html; then
              echo "✅ Deployed ${{ github.sha }} — live site confirmed serving ${EXPECT} (attempt $i)"
              echo "   Full CI (viewport + browser tests) running asynchronously in smoke-and-verify.yml"
              exit 0
            fi
            echo "attempt $i: HTTP ${CODE}, ${EXPECT} not present yet — retrying"
            sleep 10
          done
          echo "::group::live response head"; head -c 600 /tmp/live.html || true; echo; echo "::endgroup::"
          echo "::error::DEPLOY DRIFT — wrangler reported success but the live site never served ${EXPECT}. This is the 2026-08-08 drift shape, caught at deploy time instead of hours later."
          exit 1
