name: BDB availability probe
# docs/CC-CMD-2026-10-16-bdb-vintage-retrofit.md, Task 0 measurement 3.
# Dispatch-only, read-only: lists what BDB-style tracking exists (nflverse
# releases, Kaggle datasets and competitions) and commits the listing. Runs
# here because the Kaggle credentials are this repo's secrets, and the sandbox
# reaches neither kaggle.com nor the nflverse repo.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/bdb-availability-probe.py
      - name: Commit
        if: always()
        run: |
          git config user.email "bdb-probe@field"; git config user.name "BDB-Probe"
          git add outbox/bdb-availability-probe-latest.json || true
          git diff --cached --quiet && echo nothing && exit 0
          git commit -m "probe: BDB availability (run ${GITHUB_RUN_ID}) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
