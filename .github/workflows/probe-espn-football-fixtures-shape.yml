name: Probe ESPN Football Fixtures Shape

# One-shot: CC-CMD-2026-08-02-add-football-to-date-fixtures-sweep TASK 1.
# Real, live confirmation of NFL/CFB ESPN scoreboard shape for the exact
# fields fetchESPNFixturesForDate's generic mapper reads.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/probe-espn-football-fixtures-shape.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "probe-espn-football-fixtures-shape@field"
          git config user.name "Probe-ESPN-Football-Fixtures-Shape"
          git add outbox/probe-espn-football-fixtures-shape-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "probe-espn-football-fixtures-shape result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/probe-espn-football-fixtures-shape-result.json 2>/dev/null || echo "No result file produced"
