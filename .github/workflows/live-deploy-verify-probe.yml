# .github/workflows/live-deploy-verify-probe.yml
#
# LIVE DEPLOY VERIFY PROBE
# Curls the real deployed site from a GitHub Actions runner (unrestricted
# egress) — the sandbox's own network proxy returns 403 for this domain,
# confirmed via `curl -v` (CC-CMD-2026-08-02-deploy-gate-workflow-dispatch),
# so this is the CI-as-proxy escape hatch (Rule 90) for this one check.
#
# Trigger: workflow_dispatch only, no push-path trigger — this is a
# read-only verification probe, not something that should fire on every
# code push.
#
# Result: written to outbox/live-deploy-verify-{timestamp}.txt, committed
# with [skip ci] so it doesn't chain into another deploy.

name: Live Deploy Verify Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Curl the live site and check for real markers
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/live-deploy-verify-${TS}.txt"
          URL="https://jubilant-bassoon.jeffunglesbee.workers.dev/"
          echo "=== Live Deploy Verify [$TS] ===" > "$OUT"
          echo "URL: $URL" >> "$OUT"
          echo "" >> "$OUT"

          HTTP_CODE=$(curl -s -o /tmp/live.html -w "%{http_code}" "$URL")
          BYTES=$(wc -c < /tmp/live.html | xargs)
          echo "HTTP status: $HTTP_CODE" >> "$OUT"
          echo "Body bytes: $BYTES" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- NFL_DRAMA_PROFILES ---" >> "$OUT"
          grep -o "NFL_DRAMA_PROFILES=\{0,1\}{[^}]\{0,200\}" /tmp/live.html >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- escalating milestone (period>=5 or period >= 5) ---" >> "$OUT"
          grep -o "period *>= *5" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- SW_VERSION ---" >> "$OUT"
          grep -o "SW_VERSION=\{0,1\}['\"][^'\"]*['\"]" /tmp/live.html | head -2 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- bracketdo visibilitychange guard ---" >> "$OUT"
          grep -o "visibilitychange" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- getMatchupDramaBaseline (function name, call site) ---" >> "$OUT"
          grep -o "getMatchupDramaBaseline" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- DRAMA_PROFILES marker leftover (should be absent, comment-stripped) ---" >> "$OUT"
          grep -o "DRAMA_PROFILES_START" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND (expected)" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- loose NFL_DRAMA search (any casing/spacing variant) ---" >> "$OUT"
          grep -o ".\{0,20\}NFL_DRAMA.\{0,60\}" /tmp/live.html | head -3 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- literal KC drama value fragment (\"KC\":56.2) ---" >> "$OUT"
          grep -o '"KC":56\.2' /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- ViewingConditions (sanity: pre-existing feature in the same file) ---" >> "$OUT"
          grep -o "ViewingConditions" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          # CC-CMD-2026-08-08-efl-carabao-cup-coverage Task 4. The relay half is
          # verified live (/v2/games?sport=eflcup -> league:"EFL Cup"), but the
          # client half only creates cards if this SOCCER_LEAGUES entry actually
          # reaches the deployed bundle -- and deploy-gate's "Confirm" step only
          # echoes, it asserts nothing against the live site.
          echo "--- EFL Cup SOCCER_LEAGUES entry (eng.league_cup) ---" >> "$OUT"
          grep -o "eng\.league_cup" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
          echo "" >> "$OUT"

          echo "--- EFL Cup section/leagueLabel in the deployed bundle ---" >> "$OUT"
          grep -o "section: *'EFL Cup'" /tmp/live.html | head -1 >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

          echo "OUT=$OUT" >> $GITHUB_ENV
          cat "$OUT"

      - name: Push result
        run: |
          git config user.email "live-deploy-verify@field"
          git config user.name "Live-Deploy-Verify-Probe"
          git add "$OUT" 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "live-deploy-verify result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
        env:
          OUT: ${{ env.OUT }}
