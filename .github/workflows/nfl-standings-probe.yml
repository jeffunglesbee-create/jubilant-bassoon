name: NFL Standings Probe
# Task 1 (Rule 90): verify the ▼ Standings dropdown works on a live NFL card.
# Task 2 (Rule 68): dump ESPN NFL standings JSON shape for the playoff tracker.
on:
  workflow_dispatch:
  # AUTOMATED FOLLOW-UP: run automatically after every successful deploy, so a
  # deployed regression is caught without anyone remembering to trigger this.
  # The probe waits for the deploy to be live because deploy-gate has already
  # completed by the time this fires.
  workflow_run:
    workflows: ["Deploy gate (fast smoke)"]
    types: [completed]
  # Safety net in case a deploy-chained run is missed.
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: write
jobs:
  probe:
    # Skip when the triggering deploy failed — nothing new was published.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: ESPN standings shape (pre-build probe)
        run: node scripts/espn-nfl-standings-shape.mjs
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps
      - name: Standings dropdown render probe
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev
        run: node nfl_standings_render_probe.js
      - name: Commit artifacts
        if: always()
        run: |
          git config user.email "bdb-probe@field"; git config user.name "BDB-Probe"
          git add outbox/ || true
          git diff --cached --quiet && echo nothing && exit 0
          git commit -m "nfl standings probe + espn shape [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
