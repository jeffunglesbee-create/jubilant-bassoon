name: Drama Arc Amnesty Probe
# Proves the bottom-sheet Drama Arc sparkline renders only in the ADR-002
# amnesty zone (post-game). CC-CMD-2026-09-04-bottom-sheet-drama-arc-amnesty
# TASK 4b. Trigger: push to outbox/.trigger-drama-arc-amnesty-probe OR dispatch.

on:
  push:
    paths: ['outbox/.trigger-drama-arc-amnesty-probe']
  workflow_dispatch:
  # Daily. On demand only, this proves the ADR-002 amnesty gate on the bottom-sheet Drama Arc — a compliance
  # boundary, so it is verified on a schedule rather than on request
  # once and then decays silently: nothing re-checks it, and a regression would
  # first be seen by a user. 11:40 UTC is an empty slot — the 6:00-9:30 range is
  # crowded with this repo's data and deploy crons.
  schedule:
    - cron: '40 11 * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A probe that throws before writing its manifest proves nothing, and
      # `node --check` cannot catch it: run 33908009552 died on
      # `ReferenceError: days is not defined` — valid syntax, undeclared
      # binding, no manifest, one wasted round trip. no-undef catches exactly
      # that class in seconds. browser env is required because page.evaluate
      # callbacks legitimately reference window/document.
      - name: Static check the probe (no-undef)
        run: |
          npm install eslint@8
          npx eslint --no-eslintrc --env es2022,node,browser \
            --parser-options ecmaVersion:2022,sourceType:script \
            --rule '{"no-undef":"error"}' drama_arc_amnesty_probe.js

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      # The script exits 1 unless liveSparklinePresent===false AND
      # postSparklinePresent===true AND both sheets actually rendered.
      # Run it before the commit step so a failure is loud, then commit the
      # manifest either way so a failing run still leaves its evidence.
      - name: Run drama arc amnesty probe
        id: probe
        continue-on-error: true
        run: node drama_arc_amnesty_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        run: |
          git config user.email "probe@field"
          git config user.name "Drama Arc Amnesty Probe"
          # One pattern per call: `git add a b` aborts entirely if either
          # glob matches nothing, which silently dropped the manifest on run 1.
          git add outbox/drama-arc-amnesty-manifest-latest.json || true
          git add outbox/drama-arc-amnesty-post-latest.png || true
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "drama arc amnesty probe result [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              sleep $((i * 5))
            done
          fi

      - name: Fail the run if the probe failed
        if: steps.probe.outcome != 'success'
        run: |
          echo "Probe failed — see the manifest committed to outbox/."
          exit 1
