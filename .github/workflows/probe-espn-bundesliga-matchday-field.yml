name: Probe ESPN Bundesliga Matchday Field

# One-shot: CC-CMD-2026-08-02-wire-bundesliga-broadcasts-into-client
# novel-thinking retry. Checks whether ESPN's ger.1 scoreboard exposes a
# matchday/week number per event, using real past-season dates (today has
# zero scheduled Bundesliga events -- break window).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run probe
        run: node scripts/probe-espn-bundesliga-matchday-field.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "probe-espn-bundesliga-matchday@field"
          git config user.name "Probe-ESPN-Bundesliga-Matchday"
          git add outbox/probe-espn-bundesliga-matchday-field-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "probe-espn-bundesliga-matchday-field result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/probe-espn-bundesliga-matchday-field-result.json 2>/dev/null || echo "No result file produced"
