name: Verify Live Deploy Content

# One-shot: CC-CMD-2026-08-02-URGENT-trigger-deploy-gate TASK 2. Real
# live verification that the deployed site reflects real content
# (NFL_DRAMA_PROFILES, period>=5 milestone modifiers).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run verification
        run: node scripts/verify-live-deploy-content.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "verify-live-deploy-content@field"
          git config user.name "Verify-Live-Deploy-Content"
          git add outbox/verify-live-deploy-content-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-live-deploy-content result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. Verified under the exact Actions shell (bash -e -o pipefail).
          # Without this line a lost artifact reports as a green step.
          # is-ancestor, not HEAD equality: another bot pushing after us is routine
          # here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
      - name: Print result
        if: always()
        run: cat outbox/verify-live-deploy-content-result.json 2>/dev/null || echo "No result file produced"
