name: CONTRACTS.md identity check

# Mirror of the same workflow in field-relay-nba. CONTRACTS.md states at the top
# that it "must be identical in jubilant-bassoon AND field-relay-nba", and until
# 2026-08-21 nothing enforced it: this repo's copy was found 173 lines behind the
# relay's, stale since 2026-06-30. Two months of silent divergence in the file
# whose whole purpose is preventing silent divergence.
#
# Both repos carry this workflow because each only sees its own pushes. An edit
# here triggers the comparison from this side; an edit in the relay triggers it
# from that side. Between them every change to either copy is checked.
#
# NO schedule:, deliberately -- it fires on the only event that can create the
# problem. See outbox/cc-session-2026-08-16-scheduled-workflow-audit.md for why
# idle crons are not free here.

on:
  workflow_dispatch:
  push:
    paths:
      - 'CONTRACTS.md'

permissions:
  contents: read

concurrency:
  group: contracts-identity-check
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repo (jubilant-bassoon)
        uses: actions/checkout@v4
        with:
          path: client

      # No token: field-relay-nba is public (verified 2026-08-21), so an
      # unauthenticated checkout succeeds and this repo needs no cross-repo
      # secret. The relay side uses RELAY_GH_PAT because that secret exists
      # there; this repo has no equivalent, which is precisely why the
      # unauthenticated path matters.
      #
      # If field-relay-nba is ever made private, this step starts failing with
      # an authentication error. The fix is to add a read-scoped PAT here and
      # pass it as `token:` -- NOT to delete the step.
      - name: Check out field-relay-nba (public)
        uses: actions/checkout@v4
        with:
          repository: jeffunglesbee-create/field-relay-nba
          path: relay

      - name: Compare the two copies
        run: |
          set -euo pipefail
          A=relay/CONTRACTS.md
          B=client/CONTRACTS.md

          # A missing file must fail loudly rather than compare as "no diff".
          for f in "$A" "$B"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist. CONTRACTS.md must be present in both repos."
              exit 1
            fi
          done

          echo "relay:  $(wc -l < "$A") lines, sha256 $(sha256sum "$A" | cut -c1-16)"
          echo "client: $(wc -l < "$B") lines, sha256 $(sha256sum "$B" | cut -c1-16)"

          if diff -q "$A" "$B" >/dev/null; then
            echo "PASS: CONTRACTS.md is identical in both repos."
            exit 0
          fi

          echo "::error::CONTRACTS.md has DIVERGED between jubilant-bassoon and field-relay-nba."
          echo "::group::diff (relay = -, client = +)"
          diff -u "$A" "$B" || true
          echo "::endgroup::"

          # Name the direction. "They differ" leaves the next reader to work out
          # which side is behind; the line counts and the changed-section names
          # answer it directly.
          echo ""
          echo "Sections differing:"
          diff <(grep '^## ' "$A") <(grep '^## ' "$B") || true
          echo ""
          echo "Fix: copy the authoritative version over the stale one, update the"
          echo "'Last synced' line, and commit to BOTH repos in the same session."
          exit 1
