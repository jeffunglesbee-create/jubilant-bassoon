name: Verify Bundesliga E2E Historical

# One-shot: full e2e verification of the Bundesliga broadcast-enrichment
# chain against a REAL historical fixture (real ESPN data + real relay
# calls) -- the break-window gate blocks fetching CURRENT schedule data,
# not testing the pipeline against a real past date.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run verification
        run: node scripts/verify-bundesliga-e2e-historical.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "verify-bundesliga-e2e-historical@field"
          git config user.name "Verify-Bundesliga-E2E-Historical"
          git add outbox/verify-bundesliga-e2e-historical-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-bundesliga-e2e-historical result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/verify-bundesliga-e2e-historical-result.json 2>/dev/null || echo "No result file produced"
