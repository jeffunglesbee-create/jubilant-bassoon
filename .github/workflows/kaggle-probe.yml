name: Kaggle Access Probe
# One-shot: with KAGGLE creds in secrets, discover BDB competition access + file
# schema before building the tracking pipeline (Rule 68). Never prints the key.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run Kaggle probe
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/kaggle-probe.py
      - name: Commit probe output
        if: always()
        run: |
          git config user.email "kaggle-probe@field"
          git config user.name "Kaggle-Probe"
          git add outbox/kaggle-probe.txt || true
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "kaggle access probe [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
