name: CORS Probe
on:
  push:
    paths: ['outbox/.trigger-cors-probe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save
        run: |
          set +e
          URL=$(grep '^url=' outbox/.trigger-cors-probe | cut -d= -f2-)
          LIMIT=$(grep '^limit=' outbox/.trigger-cors-probe | cut -d= -f2-)
          [ -z "$LIMIT" ] && LIMIT=3000
          [ -z "$URL" ] && URL="https://baseballsavant.mlb.com/gf?game_pk=824274"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/cors-result-${TS}.txt"
          MAXTIME=$(grep '^maxtime=' outbox/.trigger-cors-probe | cut -d= -f2-)
          [ -z "$MAXTIME" ] && MAXTIME=20
          ACCEPT=$(grep '^accept=' outbox/.trigger-cors-probe | cut -d= -f2-)
          echo "URL: $URL  [$TS]" > "$OUT"
          echo "maxtime=${MAXTIME}s accept=${ACCEPT:-(none)}" >> "$OUT"

          # HEAD first, as before — but labelled, because a HEAD is NOT what a
          # browser sends and some routes answer it differently. AmbientDO's
          # /live/ambient router requires method === 'GET' and falls through to
          # a 404 on anything else, so a HEAD-only probe would manufacture the
          # very symptom it is meant to diagnose.
          echo "=== HEAD (not what a browser sends) ===" >> "$OUT"
          curl -sI --max-time 15 "$URL" >> "$OUT" 2>&1 || echo "(HEAD failed or unsupported)" >> "$OUT"

          # THE ONE THAT MATTERS: a real GET, headers dumped, bounded in time.
          # -D - writes the response headers from the GET itself rather than
          # inferring them from a different method, and --max-time lets this
          # work on a stream that never ends. Without it an SSE route hangs the
          # job instead of answering it.
          echo "" >> "$OUT"
          echo "=== GET headers (what a browser actually receives) ===" >> "$OUT"
          if [ -n "$ACCEPT" ]; then
            curl -s -D - -o /dev/null --max-time "$MAXTIME" -H "Accept: ${ACCEPT}" "$URL" >> "$OUT" 2>&1
          else
            curl -s -D - -o /dev/null --max-time "$MAXTIME" "$URL" >> "$OUT" 2>&1
          fi
          RC=$?
          # 28 is curl's timeout, which for a stream means it CONNECTED and was
          # still receiving — a success, not a failure. Saying so stops the next
          # reader treating a healthy stream as a broken route.
          [ "$RC" = "28" ] && echo "(curl exit 28 — timed out while still streaming; headers above are complete)" >> "$OUT"
          echo "" >> "$OUT"
          echo "=== ACAO present in the GET response? ===" >> "$OUT"
          # Read from a COPY. `grep FILE >> FILE` makes grep read the file it is
          # writing to; GNU grep refuses ("input file is also the output"),
          # exits non-zero, and the || branch fires — so this line printed
          # "NO ... HEADER" every single time, whatever the headers said.
          #
          # Measured 2026-09-06 on /live/ambient: the dump four lines above the
          # verdict read `access-control-allow-origin: *` and the verdict read
          # NO. A summary that contradicts the evidence it summarises is worse
          # than no summary, because the summary is the part people quote.
          cp "$OUT" /tmp/acao-scan.txt
          if grep -qi '^access-control-allow-origin' /tmp/acao-scan.txt; then
            grep -i '^access-control-allow-origin' /tmp/acao-scan.txt >> "$OUT"
          else
            echo "NO access-control-allow-origin HEADER" >> "$OUT"
          fi

          echo "" >> "$OUT"
          echo "=== BODY (first ${LIMIT} chars) ===" >> "$OUT"
          curl -s --max-time "$MAXTIME" "$URL" | head -c "$LIMIT" >> "$OUT" 2>&1 || echo "(GET body read ended)" >> "$OUT"
          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Push result
        run: |
          git config user.email "probe@field"
          git config user.name "Probe"
          git add "$OUT"
          git commit -m "probe $OUT [skip ci]"
          # Retry push with rebase — handles concurrent CI pushes to main
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
        env:
          OUT: ${{ env.OUT }}
