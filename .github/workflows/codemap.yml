name: Code Map (L3)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - smoke.js
      - STANDARDS.md
      - generate-codemap.js
      - .github/workflows/codemap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  codemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate code map
        run: node generate-codemap.js index.html > CODE_MAP.json
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('CODE_MAP.json','utf8'))"
      - name: Commit if changed
        run: |
          git add CODE_MAP.json
          if git diff --staged --quiet -- CODE_MAP.json; then
            echo "CODE_MAP.json unchanged"
            exit 0
          fi
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git commit -m "codemap: refresh from ${GITHUB_SHA::7} [skip ci]"
          # Retry with a rebase, which is what every other committing workflow
          # in this repo does. A bare `git push` was this one's own exception
          # and it lost a race on 2026-10-07: deploy-gate.yml's A190 SW_VERSION
          # auto-fix pushed 41 seconds after the commit this run was triggered
          # by, the push was rejected non-fast-forward, and the job went red
          # with the code map regenerated and thrown away. The gate's auto-fix
          # lands on EVERY deploy-triggering commit, so this was a race this
          # workflow would keep losing.
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((2**i))
          done
          # The loop exits 0 when every attempt fails — its last command is
          # `sleep`, and a failing `&&` list does not trip `set -e`. Without
          # this check a dropped code map reports as a green step. Borrowed
          # verbatim from deploy-gate.yml, which hit exactly that.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: codemap push did not land after retries"; exit 1; }
