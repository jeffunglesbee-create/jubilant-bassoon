name: NFL EPA Live Probe
# Verifies .ufl-epa-live renders on a live NFL card in the deployed app.
# Rule 90 visual corollary for CC NFL EPA wiring (P1-1/P1-2), commit 6e8b86c.
# Trigger: workflow_dispatch OR push to outbox/.trigger-nfl-epa-probe

on:
  push:
    paths: ['outbox/.trigger-nfl-epa-probe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Run NFL EPA probe
        run: node nfl_epa_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "NFL EPA Probe"
          git add outbox/nfl-epa-probe-*.png outbox/nfl-epa-probe-manifest-*.json || true
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "nfl epa probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
