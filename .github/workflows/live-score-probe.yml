name: Live Score Probe
# CI-as-proxy (Rule 90): loads the DEPLOYED page in a real browser on a runner and checks every score cell of one league against the scores ESPN and the relay actually served it
# in the same run. Task 7 of field-relay-nba docs/CC-CMD-2026-08-08-fa-cup-coverage.md (the fuzzy team match). Dispatch-only, read-only, no secret, no credit.
# Input `league`: cfb (default), eflchamp or mls. Result: outbox/live-score-probe-manifest-<league>-<ts>.json, committed back.
# Replaces cfb-live-probe.yml (its two runs' manifests stay in outbox/ as evidence).

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'cfb, eflchamp, mls or nfl'
        required: false
        default: 'cfb'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Run the live score probe
        run: node live_score_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev
          LEAGUE: ${{ github.event.inputs.league }}

      - name: Commit results
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Live Score Probe"
          git add outbox/live-score-probe-manifest-*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "live score probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when EVERY attempt fails (its last command is `sleep`), so a lost artifact would report green.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
