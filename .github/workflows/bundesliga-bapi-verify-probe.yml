# .github/workflows/bundesliga-bapi-verify-probe.yml
#
# CC-CMD-2026-08-02-wire-bundesliga-bapi-broadcasts Task 1: fresh,
# independent re-verification of wapp.bapi.bundesliga.com + a real search
# for the DFL-DAY-XXX date->ID resolution mechanism. Self-contained in
# jubilant-bassoon, no field-playground dependency (that repo hosts the
# ORIGINAL discovery script; this is an independent re-check).
#
# Result: outbox/bundesliga-bapi-verify-result.json, committed [skip ci].

name: Bundesliga Bapi Verify Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Bundesliga bapi verification
        run: npx playwright test tests/bundesliga-bapi-verify.spec.js --config=tests/bundesliga-bapi-verify.playwright.config.js
        continue-on-error: true

      - name: Push result
        run: |
          git config user.email "bundesliga-bapi-verify@field"
          git config user.name "Bundesliga-Bapi-Verify-Probe"
          git add outbox/bundesliga-bapi-verify-result.json outbox/bundesliga-matchday-page.png outbox/bundesliga-post-consent.png 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "bundesliga-bapi-verify result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Print result
        if: always()
        run: cat outbox/bundesliga-bapi-verify-result.json 2>/dev/null || echo "No result file produced"
