name: BracketDO Visibilitychange Probe
# Verifies the _bracketWS visibilitychange guard: closes on hidden, reopens
# on visible only if still in wc-mode, does not reopen if navigated away
# from wc-mode while hidden.
# CC-CMD-2026-08-02-bracketdo-visibilitychange-guard TASK 3 live verification.
# Trigger: push to outbox/.trigger-bracketdo-visibilitychange-probe OR workflow_dispatch

on:
  push:
    paths: ['outbox/.trigger-bracketdo-visibilitychange-probe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Run BracketDO visibilitychange probe
        run: node bracketdo_visibilitychange_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "BracketDO Visibilitychange Probe"
          git add outbox/bracketdo-visibilitychange-probe-manifest-*.json
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "bracketdo visibilitychange probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
