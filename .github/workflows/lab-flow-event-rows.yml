# Captures the BSD event rows field-laboratory's Flow witness needs, for its
# metrics tab (field-laboratory docs/CC-CMD-2026-10-17-metrics-tab-render-path.md).
# Dispatch-only; the sandbox cannot reach *.workers.dev, a runner can.
name: lab-flow-event-rows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Find and capture the two rows
        run: node scripts/lab-flow-event-rows.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.email "claude@field.dev"; git config user.name "FIELD CI"
          git add outbox/lab-flow-event-rows || true
          git diff --cached --quiet && exit 0
          git commit -m "capture: BSD event rows for the laboratory's Flow witness [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
