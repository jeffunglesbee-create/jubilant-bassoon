name: Token Resolution Probe
# CC-CMD-2026-08-09-token-resolution-audit.
# Sweeps the ENTIRE deployed CSSOM for unresolvable var() references, and
# partitions the phantom-token audit's changed selectors into observable vs
# provably-invisible. Trigger: outbox/.trigger-token-resolution-probe or manual.

on:
  push:
    paths: ['outbox/.trigger-token-resolution-probe']
  workflow_dispatch:
    inputs:
      undecided_budget:
        description: 'Override UNDECIDED_BUDGET (leave blank for the default 42). Set to 41 to reproduce the deliberate over-budget failure.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps
      # Static scan of the JS-embedded var() references -- the blind spot the
      # browser probe can only SIZE, not look inside (a var() in a JS string
      # is not a style until that code path renders). Runs first: it needs no
      # browser, and a fatal finding here is worth failing on before spending
      # a Chromium launch.
      - name: Check JS-embedded var() tokens
        run: node scripts/check-js-var-tokens.mjs

      - name: Run token resolution probe
        run: node token_resolution_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev
          # Passed as data, never interpolated into a shell line: a
          # workflow_dispatch input is attacker-controllable by anyone who can
          # dispatch, and this runner holds `contents: write`. The probe coerces
          # it with Number() and falls back to its own default when blank.
          UNDECIDED_BUDGET: ${{ inputs.undecided_budget }}
      # Same family: proves the UFL EPA chip renders the token its own function
      # emits, by executing that function with synthetic input rather than
      # waiting for a live UFL play. Runs after the sweep because it needs a
      # rendered .game-card to inject into.
      - name: Run UFL EPA render probe
        run: node ufl_epa_render_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        # always(): a FAIL is the result worth keeping, and the probe exits
        # non-zero on one.
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Token Resolution Probe"
          git add outbox/token-resolution-probe-*-manifest.json || echo "(no manifest)"
          git add outbox/token-resolution-probe-*.png || echo "(no screenshots)"
          git add outbox/ufl-epa-render-probe-*-manifest.json || echo "(no ufl manifest)"
          git status --short
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "token resolution probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
