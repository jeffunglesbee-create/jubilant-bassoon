name: Find Bundesliga Nonempty Broadcasts

# One-shot: search several real matchdays across the completed 2025-26
# season for one with a non-empty broadcasts array, to validate
# _fetchBundesligaRealBroadcastStreams's field-name extraction against
# real data instead of only ever-empty preseason/no-archive responses.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run search
        run: node scripts/find-bundesliga-nonempty-broadcasts.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "find-bundesliga-nonempty-broadcasts@field"
          git config user.name "Find-Bundesliga-Nonempty-Broadcasts"
          git add outbox/find-bundesliga-nonempty-broadcasts-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "find-bundesliga-nonempty-broadcasts result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/find-bundesliga-nonempty-broadcasts-result.json 2>/dev/null || echo "No result file produced"
