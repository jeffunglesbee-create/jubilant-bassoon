name: Verify Football Fixtures Sweep

# One-shot: CC-CMD-2026-08-02-add-football-to-date-fixtures-sweep TASK 3.
# Real verification against real NFL/CFB dates + a regression check
# against an existing, already-shipped sport (NHL).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run verification
        run: node scripts/verify-football-fixtures-sweep.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "verify-football-fixtures-sweep@field"
          git config user.name "Verify-Football-Fixtures-Sweep"
          git add outbox/verify-football-fixtures-sweep-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-football-fixtures-sweep result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/verify-football-fixtures-sweep-result.json 2>/dev/null || echo "No result file produced"
