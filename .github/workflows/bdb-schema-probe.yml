name: BDB Schema Probe
# One-shot (Rule 68 PRE-BUILD): dump plays/player_play headers + tracking event
# values + route labels for the two public BDB datasets, so separation and
# route-entropy builders are written against REAL columns. Never prints the key.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run BDB schema probe
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/bdb-schema-probe.py
      - name: Commit probe output
        if: always()
        run: |
          git config user.email "bdb-probe@field"
          git config user.name "BDB-Probe"
          git add outbox/bdb-schema-probe.txt || true
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "bdb schema probe [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
