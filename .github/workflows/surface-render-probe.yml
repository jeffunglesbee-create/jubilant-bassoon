name: Surface Render Probe
# CC-CMD-2026-08-09-surface-render-probe.
# Real Playwright browser against the LIVE deployed URL, proving the surfaces
# fixed by CC-CMD-2026-08-09-phantom-css-token-audit actually render opaque.
# Those declarations were invalid at computed-value time and rendered nothing.
# Trigger: push to outbox/.trigger-surface-render-probe OR workflow_dispatch

on:
  push:
    paths: ['outbox/.trigger-surface-render-probe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Run surface render probe
        run: node surface_render_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        # always(): a FAIL or NOT-OPENED is the result worth keeping, and the
        # probe exits non-zero on either. Committing only on success would
        # discard the evidence this probe exists to produce.
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Surface Render Probe"
          # Separate `git add` per pathspec: `git add` aborts the whole step
          # under `bash -e` if one glob matches nothing.
          git add outbox/surface-render-probe-*.png || echo "(no screenshots)"
          git add outbox/surface-render-probe-*-manifest.json || echo "(no manifest)"
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "surface render probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
