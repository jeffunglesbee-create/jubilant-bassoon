name: Badge Token Sweep Probe
# CC-CMD-2026-08-09-badge-chip-token-sweep Task 4.3.
# Real Playwright browser against the LIVE deployed URL, committing a
# structured manifest per touched badge/chip family. Rule 90.
# Trigger: push to outbox/.trigger-badge-token-sweep-probe OR workflow_dispatch

on:
  push:
    paths: ['outbox/.trigger-badge-token-sweep-probe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Run badge token sweep probe
        run: node badge_token_sweep_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        # always(): a FAIL verdict is exactly the result worth keeping, and the
        # probe exits non-zero on one. Committing only on success would discard
        # the evidence of the failure it exists to catch.
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Badge Token Sweep Probe"
          # Separate `git add` per pathspec: `git add` aborts the whole step
          # under `bash -e` if one glob matches nothing.
          git add outbox/badge-token-sweep-probe-*.png || echo "(no screenshot)"
          git add outbox/badge-token-sweep-probe-*-manifest.json || echo "(no manifest)"
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "badge token sweep probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
