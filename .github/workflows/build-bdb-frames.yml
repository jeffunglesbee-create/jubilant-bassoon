name: BDB Event Frames Build
# field-relay-nba docs/CC-CMD-2026-10-15-build-bdb-frames.md, Tasks 1-2:
# one row per player per named event frame (ball_snap, pass_forward), week 2
# of the 2022 BDB archive, under a 2,000,000-byte ceiling on the bytes
# uploaded. Uploads to R2 (nfl/<year>/bdb_event_frames.json), reads it back,
# and commits the same bytes to outbox/nfl/ as the relay's raw-GitHub
# fallback, as the six sibling files do. Dispatch-only: the archive is static.
# The six existing builders (build-bdb-data.py, bdb-update.yml) are untouched.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (analysers, synthetic rows)
        run: python3 scripts/build-bdb-frames.py --self-test
      - name: Build, upload, read back
        env:
          CLOUDFLARE_ACCOUNT_ID: b57e9af57ab46c52ca9215804e689c29
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/build-bdb-frames.py
      - name: Commit artifact and build report
        if: always()
        run: |
          git config user.email "bdb-bot@field"
          git config user.name "BDB-Bot"
          # One add per path: a pathspec that matches nothing makes `git add` stage
          # nothing at all, so a failed build's report would be lost with it.
          for f in outbox/bdb-event-frames-build-latest.json outbox/nfl/bdb_event_frames.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "NFL BDB: event frames build $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. is-ancestor, not HEAD equality: another bot pushing after us is
          # routine here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
