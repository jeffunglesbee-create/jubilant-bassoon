name: Forward Window Probe
# Proves the 4-day schedule window reaches the client: the field-data file was accepted
# into the cache (schema 2.1) and every forward day is in the window. When the window
# carries no MLB entries, ESPN's own MLB scoreboard is asked whether it should
# (scripts/forward-window-judge.cjs); the MLB enrichment match is then reported as NOT
# MEASURED. Rendering, enrichment and the per-sport counts the relay lists for NFL, college
# football, NBA and NHL (beside what the window file carries) are REPORTED in the manifest,
# never asserted.
# Impact analysis outbox/impact-2026-09-04-forward-schedule-window.md §11/§14d.
# Trigger: push to outbox/.trigger-forward-window-probe OR dispatch.

on:
  push:
    paths: ['outbox/.trigger-forward-window-probe']
  workflow_dispatch:
  # Daily. On demand only, this proves the 4-day schedule window reaching the client — the generator runs daily at
  # 07:30 UTC, so this checks the file it produced this morning
  # once and then decays silently: nothing re-checks it, and a regression would
  # first be seen by a user. 11:20 UTC is an empty slot — the 6:00-9:30 range is
  # crowded with this repo's data and deploy crons.
  schedule:
    - cron: '20 11 * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A probe that throws before writing its manifest proves nothing, and
      # `node --check` cannot catch it: run 33908009552 died on
      # `ReferenceError: days is not defined` — valid syntax, undeclared
      # binding, no manifest, one wasted round trip. no-undef catches exactly
      # that class in seconds. browser env is required because page.evaluate
      # callbacks legitimately reference window/document.
      - name: Static check the probe (no-undef)
        run: |
          npm install eslint@8
          npx eslint --no-eslintrc --env es2022,node,browser \
            --parser-options ecmaVersion:2022,sourceType:script \
            --rule '{"no-undef":"error"}' forward_window_probe.js scripts/forward-window-judge.cjs scripts/probe-meta-read.cjs scripts/forward-window-relay.cjs

      # The probe's verdict is one module (scripts/forward-window-judge.cjs), so the probe and its checks cannot
      # disagree. A window with 0 MLB entries passes as "enrichment NOT MEASURED" only when ESPN's own MLB
      # scoreboard lists none on those dates and every date was fetched; if ESPN lists games, or cannot be asked,
      # it fails. 95 cases (three real manifests the probe committed, four real ESPN event shapes); 69 mutations
      # prove the cases can fail.
      # Runs before the browser so a broken verdict fails in seconds.
      - name: The forward-window verdict holds, and can fail
        run: |
          node scripts/check-forward-window-judge.mjs
          node scripts/mutate-forward-window-judge.mjs

      # The window file carries only MLB, MLS and WNBA on forward days, so a green probe said nothing about the other
      # sports (2026-10-30: the relay listed 12 NFL games for Sunday and the probe passed with that day at 0). The probe
      # now reports, per sport, what the relay lists for each forward day beside what the file carries; nothing here can fail
      # the run. The check runs the collector against real relay shapes, including the NHL outage that arrives as HTTP 200
      # with no games (a null, never a zero); 33 mutations prove the cases can fail.
      - name: The relay coverage capture holds, and can fail
        run: |
          node scripts/check-forward-window-relay.mjs
          node scripts/mutate-forward-window-relay.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      # The page reloads itself when its service worker first activates (src/legacy/field.js), and the probe's context is
      # always fresh, so on some runs the reload lands between the probe's wait for the cache metadata and its read of
      # it. 4 of the 15 runs in this clone's history (2026-10-19 to 2026-10-30) died there ("Execution context was
      # destroyed") and reported the cache as never accepted for a page that was working. The read now survives a lost
      # context and nothing else (a 30 s timeout is still one 30 s timeout). This step forces a real reload into that
      # window in headless Chromium, first proves the old single-shot read fails on the same page, then proves the new
      # one survives it (32 cases).
      - name: The metadata read survives a page reload
        run: node scripts/check-probe-meta-read.mjs

      # 28 mutations prove those cases can fail. Each launches a browser, about two minutes in all, and the check does not
      # change between daily runs, so the scheduled run skips it. Every push and dispatch runs it, which is when the check
      # or the module changes.
      - name: The metadata read check can fail
        if: github.event_name != 'schedule'
        run: node scripts/mutate-probe-meta-read.mjs

      # The script exits 1 when the verdict (scripts/forward-window-judge.cjs) has any
      # problem: the cache was not accepted, the schema is not 2.1, a forward day did
      # not reach the client, or the window carries no MLB entries while ESPN lists
      # games the generator carries (or could not be asked). Run it before the commit
      # step so a failure is loud, then commit the manifest either way so a failing
      # run still leaves its evidence behind.
      - name: Run forward window probe
        id: probe
        continue-on-error: true
        run: node forward_window_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev

      - name: Commit results
        run: |
          git config user.email "probe@field"
          git config user.name "Forward Window Probe"
          git add outbox/forward-window-manifest-latest.json || true
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "forward window probe result [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              sleep $((i * 5))
            done
            # The loop above exits 0 when EVERY attempt fails: its last command is
            # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
            # command. Verified under the exact Actions shell (bash -e -o pipefail).
            # Without this line a lost artifact reports as a green step.
            # is-ancestor, not HEAD equality: another bot pushing after us is routine
            # here and must not read as our failure.
            git fetch -q origin main
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "FAIL: push did not land after retries"; exit 1; }
          fi

      - name: Fail the run if the probe failed
        if: steps.probe.outcome != 'success'
        run: |
          echo "Probe failed — see the manifest committed to outbox/."
          exit 1
