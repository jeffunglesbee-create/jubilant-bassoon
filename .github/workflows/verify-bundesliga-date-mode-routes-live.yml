name: Verify Bundesliga Date Mode Routes Live

# One-shot: CC-CMD-2026-08-02-wire-bundesliga-broadcasts-date-mode TASK 1.
# Fresh, live confirmation both relay routes work for a real known pair.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run verification
        run: node scripts/verify-bundesliga-date-mode-routes-live.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "verify-bundesliga-date-mode-routes-live@field"
          git config user.name "Verify-Bundesliga-Date-Mode-Routes-Live"
          git add outbox/verify-bundesliga-date-mode-routes-live-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-bundesliga-date-mode-routes-live result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/verify-bundesliga-date-mode-routes-live-result.json 2>/dev/null || echo "No result file produced"
