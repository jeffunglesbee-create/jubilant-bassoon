# .github/workflows/laliga-apim-verify-probe.yml
#
# CC-CMD-2026-08-02-wire-laliga-apim-standings Task 1: fresh, independent
# re-verification of apim.laliga.com + the subscription key, entirely
# self-contained in jubilant-bassoon. Does not depend on field-playground
# (that repo hosts the ORIGINAL discovery script; this is a narrower,
# independent re-check, not a reuse of that repo's tooling).
#
# Result: outbox/laliga-apim-verify-result.json, committed with [skip ci].

name: LaLiga Apim Verify Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run LaLiga apim verification
        run: npx playwright test tests/laliga-apim-verify.spec.js --config=tests/laliga-apim-verify.playwright.config.js
        continue-on-error: true

      - name: Push result
        run: |
          git config user.email "laliga-apim-verify@field"
          git config user.name "LaLiga-Apim-Verify-Probe"
          git add outbox/laliga-apim-verify-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "laliga-apim-verify result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Print result
        if: always()
        run: cat outbox/laliga-apim-verify-result.json 2>/dev/null || echo "No result file produced"
