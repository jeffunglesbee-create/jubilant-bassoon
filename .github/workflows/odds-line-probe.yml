name: Odds Line Probe
# Reads [data-slot="odds"] from the LIVE DOM and names a game id per state.
# CC-CMD-2026-09-11-client-odds-story TASK 3 live verification.
# Trigger: push to outbox/.trigger-odds-line-probe OR workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD for the context-game check. Blank = today UTC.'
        required: false
        default: ''
      slate_ids:
        description: 'Comma-separated client slate ids (e.g. g16,g17) to ask /context/game for.'
        required: false
        default: ''
      settle_min_s:
        description: 'Keep sampling the slate to at least this many seconds even after it settles. Default 0 (stop on the criterion). Set to 60 when the question is whether a late-injecting section ever arrives — three equal samples can land at 15s, which is not evidence about 40s.'
        required: false
        default: '0'
      step_back_days:
        description: 'Days to step the slate back before reading the DOM. Default 0. Since 2026-09-12 a past date renders a real slate sourced from the relay (CC-CMD-2026-09-12-past-date-slate-from-relay); before that it rendered neither cards nor a message, so manifests from earlier runs with this set above 0 are measuring that defect, not odds.'
        required: false
        default: '0'
  # NEITHER cron runs at the hour it names. Measured 2026-09-15 across every
  # scheduled run this workflow has had:
  #
  #   34747944004  03:45 cron  started 09-13 08:32Z  +4h47m
  #   34775630281  16:10 cron  started 09-13 18:45Z  +2h36m
  #   34826955734  03:45 cron  started 09-14 09:15Z  +5h30m
  #   34892026130  16:10 cron  started 09-14 20:17Z  +4h07m
  #   34949877281  03:45 cron  started 09-15 08:58Z  +5h13m
  #
  # The delay is 2h10m to 5h30m and not controllable from here. The reasoning
  # these two times were chosen for (below, kept as the record) was sound about
  # the game calendar and wrong about one thing only: that the scheduler would
  # honour the hour. Compensating by moving the cron earlier would be guessing
  # against a 3h20m spread, so the probe no longer depends on its start hour at
  # all — scheduled runs read Yesterday, which is a complete slate at every
  # hour (scripts/probe-window.cjs, and manifest 20260912T190808Z: 26 cards,
  # 26 debriefs, odds layer in the DOM).
  schedule:
    # 16:10 UTC — European league matches kick off at 14:00 UTC and go final
    # around 15:50, while the client's ET date is still the same day. Probed
    # 2026-09-12: EPL_2026-09-12_e401879285 carries espn_event_id 401879285 and
    # an opening_odds moneyline, so a finished EPL card has everything the
    # movement layer needs. ACTUAL start: 18:20-20:17Z.
    - cron: '10 16 * * *'
    # 03:45 UTC = 23:45 ET, the US window: the day's MLB/NFL/NBA games are final
    # and the ET date has not rolled over. ACTUAL start: 08:32-09:15Z = 04:32-
    # 05:15 ET, by which time the ET date HAS rolled over. All three of its runs
    # read a scheduled slate and reported debriefs 0.
    - cron: '45 3 * * *'
  push:
    paths: ['outbox/.trigger-odds-line-probe']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Does the odds data even reach /context/game?
        run: node scripts/probe-context-game-odds.mjs
        env:
          PROBE_DATE: ${{ inputs.date }}
          SLATE_IDS: ${{ inputs.slate_ids }}
        continue-on-error: true

      # The probe now decides when the slate has settled instead of waiting a
      # flat 12s (CC-CMD-2026-09-12-slate-size-variance). That criterion is one
      # function shared with these checks, so it cannot drift from what is
      # tested. Twelve enumerated series; four mutations prove the cases can
      # fail. Runs before the browser so a broken criterion fails in seconds
      # rather than after a two-minute page load.
      - name: The slate settle criterion holds, and can fail
        run: |
          node scripts/check-slate-settle.mjs
          node scripts/mutate-slate-settle.mjs

      # Same pattern, for the window the run actually landed in. Without this a
      # debrief census of 0 is reported identically whether the injector broke
      # or the slate simply had no finished games yet — which is how three dead
      # scheduled runs looked like results (Rule 91).
      - name: The window reality holds, and can fail
        run: |
          node scripts/check-probe-window.mjs
          node scripts/mutate-probe-window.mjs

      # A splitter that mislabels which sections are a defect turns a real
      # reading into a wrong diagnosis, so it runs before the browser half.
      - name: The gap split holds, and can fail
        run: |
          node scripts/check-gap-split.mjs
          node scripts/mutate-gap-split.mjs

      - name: Run odds line probe
        run: node odds_line_probe.js
        env:
          FIELD_URL: https://jubilant-bassoon.jeffunglesbee.workers.dev
          SLATE_SETTLE_MIN_S: ${{ github.event.inputs.settle_min_s || '0' }}
          # Deliberately NOT `|| '0'`. On a schedule event `inputs` is empty, and
          # an explicit '0' would pin every scheduled run to Today — the exact
          # behaviour that made the 03:45 cron's three runs useless. Empty means
          # "unset", and probe-window.cjs then defaults a scheduled run to 1.
          STEP_BACK_DAYS: ${{ inputs.step_back_days }}
          PROBE_TRIGGER: ${{ github.event_name }}

      # always(): the manifest is written to disk before the probe exits, and a
      # FAILING probe is exactly when its evidence matters. Runs 7, 8 and 9 all
      # failed and committed nothing, so three diagnoses had to be read out of
      # job logs that expire. The artifact is the point (Rule 90).
      # The done condition of CC-CMD-2026-09-12-v2-sections-in-model-not-in-dom
      # is five consecutive SCHEDULED greens. The manifests have recorded
      # `triggered_by` all along and nothing read them, so the count could only
      # be had by eyeballing a directory — which produced "2 of 5" and "3 of 5"
      # on 2026-09-13 when the real figure was 1. Every run now says where it
      # stands, in its own summary.
      #
      # Runs BEFORE the commit step and still counts the run that just finished:
      # odds_line_probe.js writes its manifest to disk before exiting, which is
      # the same property the commit step's always() relies on.
      - name: Sections-gap streak
        if: always()
        run: |
          # The counter's own tests run here, not only the counter. Its
          # same-day-comparison exclusion (2026-09-22) is the second reset this
          # denominator has needed, and a reset the tests cannot prove it
          # enforces is a reset in prose only.
          node scripts/check-sections-gap-streak-logic.mjs
          node scripts/mutate-sections-gap-streak.mjs
          node scripts/check-sections-gap-streak.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Odds Line Probe"
          git add outbox/odds-line-probe-*.png outbox/odds-line-probe-manifest-*.json outbox/context-game-odds-*.json
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "odds line probe result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. Verified under the exact Actions shell (bash -e -o pipefail).
          # Without this line a lost artifact reports as a green step.
          # is-ancestor, not HEAD equality: another bot pushing after us is routine
          # here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
